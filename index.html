<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script to Speech</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: dark; font-family: Montserrat, system-ui, sans-serif;
    --cyan: #29e7ff; --violet: #9d5cff; --pink: #ff4fd8;
    --text: #e8eaff; --muted: #9ba3c9; --line: rgba(157, 92, 255, .3);
  }
  body {
    margin: 0; padding: clamp(1.5rem, 6vh, 4rem) 1rem; color: var(--text); line-height: 1.5;
    background:
      radial-gradient(45rem 35rem at 0 0, rgba(255, 79, 216, .22), transparent 60%) fixed,
      radial-gradient(45rem 35rem at 100% 15%, rgba(41, 231, 255, .18), transparent 60%) fixed,
      #070716;
  }
  main {
    max-width: 42rem; margin: 0 auto; padding: clamp(1.25rem, 5vw, 2.5rem);
    background: rgba(16, 14, 40, .6); border: 1px solid var(--line); border-radius: 1.5rem;
    backdrop-filter: blur(14px); box-shadow: 0 0 50px rgba(157, 92, 255, .18), 0 30px 80px rgba(0, 0, 0, .55);
  }
  h1 {
    width: fit-content; margin: 0; font-size: clamp(2rem, 7vw, 2.9rem); letter-spacing: -.02em;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(157, 92, 255, .6));
  }
  label { display: block; margin: 1.6rem 0 .5rem; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  textarea, select { width: 100%; box-sizing: border-box; padding: .8rem 1rem; font: inherit; color: inherit; background: rgba(6, 6, 22, .75); border: 1px solid var(--line); border-radius: .8rem; transition: border-color .2s, box-shadow .2s; }
  textarea { resize: vertical; }
  #script { min-height: 14rem; }
  textarea:focus-visible, select:focus-visible { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(41, 231, 255, .2), 0 0 22px rgba(41, 231, 255, .35); }
  select:disabled { opacity: .35; cursor: not-allowed; }
  option, optgroup { background: #0d0c24; color: var(--text); }
  input[type=file] { font: inherit; font-size: .9rem; color: var(--muted); }
  ::file-selector-button { margin-right: .8rem; padding: .45rem 1.1rem; font: inherit; font-weight: 600; color: var(--cyan); background: transparent; border: 1px solid var(--cyan); border-radius: 999px; cursor: pointer; transition: background .2s, box-shadow .2s; }
  ::file-selector-button:hover { background: rgba(41, 231, 255, .1); box-shadow: 0 0 16px rgba(41, 231, 255, .5); }
  small { display: block; margin-top: .6rem; font-size: .85rem; color: var(--muted); }
  code { padding: .1rem .4rem; border-radius: .4rem; font-size: .85em; color: var(--pink); background: rgba(255, 79, 216, .12); }
  summary { margin-top: 1.6rem; font-weight: 600; color: var(--cyan); cursor: pointer; }
  summary::marker { color: var(--pink); }
  summary:hover { text-shadow: 0 0 12px rgba(41, 231, 255, .8); }
  button {
    width: 100%; margin-top: 2rem; padding: .95rem 1.5rem; font: inherit; font-weight: 700; letter-spacing: .04em; color: #0a0a1f;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink)); border: 0; border-radius: .9rem; cursor: pointer;
    box-shadow: 0 0 26px rgba(157, 92, 255, .5); transition: box-shadow .2s, filter .2s;
  }
  button:hover { box-shadow: 0 0 40px rgba(255, 79, 216, .65); }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  button:disabled { cursor: progress; filter: saturate(.5) brightness(.8); }
  #status { min-height: 1.5em; margin: 1rem 0 0; text-align: center; color: var(--muted); }
  #status.error { color: #ff5c8a; }
  form:has(#go:disabled) #status { color: var(--cyan); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  #result { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
  audio { width: 100%; border-radius: 999px; box-shadow: 0 0 26px rgba(41, 231, 255, .3); }
  #download { display: inline-block; margin-top: 1rem; padding: .5rem 1.2rem; font-weight: 600; color: var(--pink); text-decoration: none; border: 1px solid var(--pink); border-radius: 999px; transition: box-shadow .2s; }
  #download:hover { box-shadow: 0 0 18px rgba(255, 79, 216, .55); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
<h1>Script to Speech</h1>
<form id="form">
  <label for="file">Script file (.txt / .md)</label>
  <input type="file" id="file" accept=".txt,.md,text/plain,text/markdown">

  <label for="script">Script</label>
  <textarea id="script" required placeholder="Upload a file or paste your script here…"></textarea>
  <small>Add emotion tags inline, e.g. <code>[whispering]</code>, <code>[excited]</code>, <code>[sad][sighing]</code>.</small>

  <label for="voice">Voice</label>
  <select id="voice">
    <option value="">Model default</option>
    <optgroup label="Female">
      <option value="933563129e564b19a115bedd57b7406a">Sarah: soft, narration</option>
      <option value="b347db033a6549378b48d00acb0d06cd">Selene: calm, meditative</option>
      <option value="9a9cf47702da476aa4629e2506d4a857">Hannah: professional, confident</option>
      <option value="c2623f0c075b4492ac367989aee1576f">Paula: educational, conversational</option>
      <option value="b545c585f631496c914815291da4e893">Friendly: bright, energetic</option>
      <option value="5567200c7d8341738f0892bbacd3be3c">Féminine: calm, French accent</option>
      <option value="5161d41404314212af1254556477c17d">Genki: gentle, Japanese accent</option>
    </optgroup>
    <optgroup label="Male">
      <option value="536d3a5e000945adb7038665781a4aca">Ethan: clear narration</option>
      <option value="bf322df2096a46f18c579d0baa36f41d">Adrian: deep, measured</option>
      <option value="c5f56a6cc2ec4fa8920cb4c5889a3fb7">Slax: smooth, crisp</option>
      <option value="802e3bc2b27e49c2995d23ef70e6ac89">Energetic Male: promo, upbeat</option>
    </optgroup>
  </select>

  <details id="clone">
    <summary>Or clone a voice from your own sample</summary>
    <label for="sample">Voice sample (10–30 s clip, max 15 MB)</label>
    <input type="file" id="sample" accept="audio/*">
    <label for="transcript">Transcript of the sample (optional)</label>
    <textarea id="transcript" rows="3" placeholder="What's said in the clip. Improves accuracy."></textarea>
  </details>

  <button id="go">Generate audio</button>
  <p id="status" role="status"></p>
</form>

<div id="result" hidden>
  <audio id="player" controls></audio>
  <a id="download" download="speech.mp3">Download MP3</a>
</div>
</main>

<script>
  const $ = id => document.getElementById(id);

  $('file').onchange = async e => {
    const f = e.target.files[0];
    if (f) $('script').value = await f.text();
  };

  $('clone').ontoggle = () => { $('sample').required = $('voice').disabled = $('clone').open; };

  const dataUrl = f => new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => fail(r.error);
    r.readAsDataURL(f);
  });

  $('form').onsubmit = async e => {
    e.preventDefault();
    const status = $('status');
    $('go').disabled = true;
    status.className = '';
    status.textContent = 'Generating… long scripts can take a few minutes.';
    try {
      const body = { text: $('script').value };
      if ($('clone').open) {
        body.sample = await dataUrl($('sample').files[0]);
        body.transcript = $('transcript').value.trim();
      } else {
        body.voice = $('voice').value;
      }
      const res = await fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
      URL.revokeObjectURL($('download').href);
      $('player').src = $('download').href = URL.createObjectURL(await res.blob());
      $('result').hidden = false;
      status.textContent = 'Done.';
    } catch (err) {
      status.className = 'error';
      status.textContent = err.message;
    } finally {
      $('go').disabled = false;
    }
  };
</script>
</body>
</html>
